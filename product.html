<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>تفاصيل المنتج</title>

    <link
        rel="stylesheet"
        href="css/style.css">

</head>


<body>


<header class="header">

    <div class="container header-inner">

        <a
            class="logo"
            href="index.html">

            🛍️ متجري

        </a>


        <nav class="nav">

            <a href="index.html">
                الرئيسية
            </a>

            <a href="index.html#categories">
                الأقسام
            </a>

            <a href="index.html#products">
                المنتجات
            </a>

        </nav>


        <button
            class="cart-button"
            onclick="openCart()">

            🛒 السلة

            <span id="cartCount">
                0
            </span>

        </button>

    </div>

</header>



<main>

    <section class="section">

        <div class="container">


            <a
                href="index.html#products"
                class="hero-button">

                ← العودة إلى المنتجات

            </a>


            <div
                id="productDetails"
                style="margin-top:30px;">

            </div>


        </div>

    </section>

</main>



<!-- =================================
     السلة
================================= -->

<div
    id="cartOverlay"
    class="overlay hidden"
    onclick="closeCart(event)">


    <aside
        class="cart-panel"
        onclick="event.stopPropagation()">


        <div class="cart-header">

            <h2>
                🛒 سلة المشتريات
            </h2>


            <button
                onclick="closeCart()">

                ✕

            </button>

        </div>


        <div
            id="cartItems"
            class="cart-items">
        </div>


        <div class="cart-footer">

            <div class="cart-total">

                <span>
                    الإجمالي
                </span>


                <strong>

                    <span id="cartTotal">
                        0
                    </span>

                    د.ع

                </strong>

            </div>


            <button
                class="checkout-button"
                onclick="showCheckoutNotice()">

                إتمام الطلب

            </button>

        </div>

    </aside>

</div>



<script src="js/products.js"></script>


<script>

/*
==================================================
       قراءة رقم المنتج من الرابط
==================================================
*/

const urlParams =
    new URLSearchParams(
        window.location.search
    );


const productId =
    Number(
        urlParams.get("id")
    );


/*
==================================================
            كمية المنتج
==================================================
*/

let detailQuantity = 1;


/*
==================================================
          عرض تفاصيل المنتج
==================================================
*/

function showProductDetails() {

    const container =
        document.getElementById(
            "productDetails"
        );


    const product =
        products.find(
            function (item) {

                return item.id === productId;

            }
        );


    if (!product) {

        container.innerHTML = `

            <div
                style="
                    background:white;
                    padding:40px;
                    border-radius:15px;
                    text-align:center;
                "
            >

                <h2>
                    المنتج غير موجود
                </h2>


                <p>
                    تأكد من أن رابط المنتج صحيح.
                </p>


                <a
                    href="index.html#products"
                    class="hero-button">

                    العودة إلى المنتجات

                </a>

            </div>

        `;

        return;

    }


    container.innerHTML = `

        <div
            style="
                display:grid;
                grid-template-columns:
                    repeat(
                        auto-fit,
                        minmax(280px, 1fr)
                    );
                gap:30px;
                background:white;
                padding:25px;
                border-radius:18px;
                box-shadow:
                    0 5px 20px
                    rgba(0,0,0,.08);
            "
        >


            <!-- صورة المنتج -->

            <div
                style="
                    min-height:350px;
                    background:#eef2f7;
                    border-radius:15px;
                    display:flex;
                    align-items:center;
                    justify-content:center;
                    font-size:120px;
                "
            >

                ${product.icon}

            </div>


            <!-- معلومات المنتج -->

            <div
                style="
                    display:flex;
                    flex-direction:column;
                    justify-content:center;
                "
            >

                <div
                    style="
                        color:#16a34a;
                        margin-bottom:10px;
                    "
                >

                    ${escapeHTML(
                        product.category
                    )}

                </div>


                <h1
                    style="
                        margin:0 0 15px;
                        font-size:32px;
                    "
                >

                    ${escapeHTML(
                        product.name
                    )}

                </h1>


                <p
                    style="
                        color:#666;
                        line-height:2;
                        font-size:16px;
                    "
                >

                    ${escapeHTML(
                        product.description
                    )}

                </p>


                <div
                    style="
                        font-size:28px;
                        font-weight:800;
                        margin:20px 0;
                    "
                >

                    ${formatNumber(
                        product.price
                    )}

                    د.ع

                </div>


                <!-- =================================
                     أزرار الكمية
                ================================== -->

                <div
                    style="
                        display:flex;
                        align-items:center;
                        gap:15px;
                        margin-bottom:20px;
                    "
                >

                    <span>
                        الكمية:
                    </span>


                    <button
                        type="button"
                        onclick="changeDetailQuantity(-1)"

                        style="
                            width:42px;
                            height:42px;
                            border:0;
                            border-radius:8px;
                            background:#e5e7eb;
                            font-size:24px;
                            font-weight:bold;
                            cursor:pointer;
                        "
                    >

                        −

                    </button>


                    <strong
                        id="detailQuantity"
                        style="
                            min-width:35px;
                            text-align:center;
                            font-size:20px;
                        "
                    >

                        1

                    </strong>


                    <button
                        type="button"
                        onclick="changeDetailQuantity(1)"

                        style="
                            width:42px;
                            height:42px;
                            border:0;
                            border-radius:8px;
                            background:#e5e7eb;
                            font-size:24px;
                            font-weight:bold;
                            cursor:pointer;
                        "
                    >

                        +

                    </button>

                </div>


                <!-- =================================
                     إضافة للسلة
                ================================== -->

                <button
                    type="button"

                    onclick="
                        addProductToCart(
                            ${product.id}
                        )
                    "

                    style="
                        border:0;
                        padding:15px;
                        border-radius:10px;
                        background:#16a34a;
                        color:white;
                        font-weight:800;
                        font-size:17px;
                        cursor:pointer;
                    "
                >

                    🛒 إضافة إلى السلة

                </button>


            </div>

        </div>

    `;

}


/*
==================================================
           تغيير كمية صفحة التفاصيل
==================================================
*/

function changeDetailQuantity(
    change
) {

    detailQuantity += change;


    if (
        detailQuantity < 1
    ) {

        detailQuantity = 1;

    }


    const element =
        document.getElementById(
            "detailQuantity"
        );


    if (element) {

        element.textContent =
            detailQuantity;

    }

}


/*
==================================================
       إضافة المنتج إلى السلة
==================================================
*/

function addProductToCart(
    id
) {

    const product =
        products.find(
            function (item) {

                return item.id === id;

            }
        );


    if (!product) return;


    const existing =
        cart.find(
            function (item) {

                return item.id === id;

            }
        );


    if (existing) {

        existing.quantity +=
            detailQuantity;

    }

    else {

        cart.push({

            id:
                product.id,

            name:
                product.name,

            price:
                product.price,

            quantity:
                detailQuantity

        });

    }


    /*
    إعادة الكمية إلى 1
    */

    detailQuantity = 1;


    const element =
        document.getElementById(
            "detailQuantity"
        );


    if (element) {

        element.textContent = "1";

    }


    saveCart();

    renderCart();


    /*
    ==========================================
    مهم:
    لا نفتح السلة بعد الإضافة
    ==========================================
    */

}


/*
==================================================
             تشغيل صفحة التفاصيل
==================================================
*/

document.addEventListener(
    "DOMContentLoaded",
    function () {

        showProductDetails();

        renderCart();

    }
);

</script>


</body>

</html>
